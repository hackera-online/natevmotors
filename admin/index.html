<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ панел – BM Auto Group</title>
  <link rel="icon" type="image/svg+xml" href="../images/logo-mark.svg">
  <link rel="stylesheet" href="admin.css">
  <script src="../data/site.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button type="button" class="top__menu" id="menu-btn" aria-label="Меню">☰</button>
      <img src="../images/logo-mark.svg" alt="" width="32" height="32">
      <strong>BM Auto Group <span>· Админ панел</span></strong>
      <span class="top__status" id="status" role="status" aria-live="polite">Всичко е запазено</span>
      <a class="btn btn--ghost" href="../index.html" target="_blank" rel="noopener">Отвори сайта ↗</a>
      <button type="button" class="btn" id="preview-btn">Преглед</button>
    </header>
    <nav class="side" id="side" aria-label="Раздели"></nav>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="preview" id="preview" aria-label="Преглед на сайта">
      <div class="preview__bar">
        <strong>Преглед</strong>
        <div class="seg" id="devices">
          <button type="button" data-w="100%" class="on">Десктоп</button>
          <button type="button" data-w="820px">Таблет</button>
          <button type="button" data-w="390px">Телефон</button>
        </div>
        <button type="button" class="btn btn--ghost" id="preview-reload">↻</button>
        <button type="button" class="btn btn--ghost preview__close" id="preview-close">✕</button>
      </div>
      <div class="preview__stage"><iframe id="frame" title="Преглед на сайта" src="../index.html?embed=1"></iframe></div>
    </aside>
  </div>
  <script src="admin.js"></script>
</body>
</html>
